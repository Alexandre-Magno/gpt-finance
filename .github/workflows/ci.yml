name: CI & publish images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR exige o namespace em minusculas; o mesmo prefixo esta em docker-compose.prod.yml
  IMAGE_PREFIX: ghcr.io/alexandre-magno/gpt-finance

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Checks ────────────────────────────────────────────────────────────
  # O projeto nao tem suite de testes (nenhum tests/, nenhum pytest configurado),
  # entao aqui so validamos lint, tipos e sintaxe.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Lint frontend
        run: npm run lint
        working-directory: front

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: front

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check backend
        run: python -m compileall -q app utils ingestion

  # ── Job 2: Build & push das imagens para o GHCR ──────────────────────────────
  build-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: app/Dockerfile
          - component: frontend
            context: ./front
            dockerfile: front/Dockerfile
            # rewrites() do Next e resolvido no build, nao em runtime
            build-args: |
              BACKEND_URL=http://backend:8000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Nao ha job de deploy aqui: a porta 22 da VM so aceita conexao do IP do dono,
  # entao um runner do GitHub nunca consegue fazer SSH para la. O deploy e
  # pull-based -- a VM roda scripts/deploy.sh por um timer systemd
  # (gptfin-deploy.timer), autentica no GitHub com uma deploy key read-only e
  # sobe a imagem :sha-<commit> que este workflow acabou de publicar.
