name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR exige o namespace em minusculas; o mesmo prefixo esta em docker-compose.prod.yml
  IMAGE_PREFIX: ghcr.io/alexandre-magno/gpt-finance

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Checks ────────────────────────────────────────────────────────────
  # O projeto nao tem suite de testes (nenhum tests/, nenhum pytest configurado),
  # entao aqui so validamos lint, tipos e sintaxe.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Lint frontend
        run: npm run lint
        working-directory: front

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: front

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check backend
        run: python -m compileall -q app utils ingestion

      - name: Run backend tests
        run: |
          pip install -q -r requirements-api.txt -r requirements-dev.in
          pytest -q

  # ── Job 2: Build & push das imagens para o GHCR ──────────────────────────────
  build-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: app/Dockerfile
          - component: frontend
            context: ./front
            dockerfile: front/Dockerfile
            # rewrites() do Next e resolvido no build, nao em runtime
            build-args: |
              BACKEND_URL=http://backend:8000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ── Job 3: Deploy na VM ──────────────────────────────────────────────────────
  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR=/root/gpt-finance
            COMPOSE="docker compose -f docker-compose.prod.yml"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERRO: $APP_DIR/.env nao existe. Crie a partir de .env-example."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # commit em producao hoje, para rollback
            PREV_SHA=$(cat .deploy-tag 2>/dev/null || echo "")
            echo "anterior: ${PREV_SHA:-<nenhum>} | novo: ${{ github.sha }}"

            git fetch origin main
            git checkout -q main
            git reset -q --hard origin/main

            export IMAGE_TAG
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            # o backend carrega tres modelos de embedding no start
            echo "aguardando backend e frontend..."
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:8010/health > /dev/null 2>&1 \
                 && curl -sf http://127.0.0.1:3010/ > /dev/null 2>&1; then
                HEALTHY=true
                echo "stack saudavel apos $((i * 5))s"
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "ERRO: health check falhou apos o deploy"
              $COMPOSE ps
              $COMPOSE logs --tail=100
              if [ -n "$PREV_SHA" ]; then
                echo "revertendo para $PREV_SHA..."
                git reset -q --hard "$PREV_SHA"
                IMAGE_TAG="sha-$PREV_SHA" $COMPOSE up -d
                echo "rollback concluido"
              else
                echo "sem versao anterior registrada - nada para reverter"
              fi
              docker logout ghcr.io || true
              exit 1
            fi

            # mesmo arquivo de estado que scripts/deploy.sh usa, para o deploy
            # manual continuar sabendo o que esta no ar
            echo "${{ github.sha }}" > .deploy-tag
            docker image prune -f
            docker logout ghcr.io
            echo "deploy concluido: ${{ github.sha }}"
